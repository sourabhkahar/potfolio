<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .plane{animation:fly 5s ease-in-out infinite}
    @keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-12px) rotate(-4deg)}}
    .trail{stroke-dasharray:6 9;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-30}}
    .ty{transform-box:fill-box;transform-origin:left;animation:ty 4s steps(8) infinite}.ty2{animation-delay:.6s}
    @keyframes ty{0%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
    .sp{animation:tw 2.4s ease-in-out infinite}.sp2{animation-delay:.8s}.sp3{animation-delay:1.6s}
    @keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
    .sp{transform-box:fill-box;transform-origin:center}
    .ok{animation:pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pop{0%,45%{transform:scale(0)}55%{transform:scale(1.15)}62%,92%{transform:scale(1)}100%{transform:scale(0)}}
  </style>
  <circle cx="140" cy="134" r="104" fill="#F5EFE4" opacity=".04"/>
  <circle cx="140" cy="134" r="74" stroke="#F5EFE4" stroke-opacity=".08" stroke-width="2"/>
  <!-- chat window -->
  <rect x="30" y="98" width="150" height="112" rx="16" fill="#1E1B18" stroke="#F5EFE4" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="48" cy="116" r="4" fill="#D96A2B"/><circle cx="61" cy="116" r="4" fill="#6E655B"/><circle cx="74" cy="116" r="4" fill="#6E655B"/>
  <rect x="46" y="134" width="88" height="22" rx="11" fill="#3A342E"/>
  <rect class="ty" x="56" y="142" width="64" height="6" rx="3" fill="#E2D9CC"/>
  <rect x="74" y="164" width="92" height="22" rx="11" fill="#C2571A"/>
  <rect class="ty ty2" x="84" y="172" width="70" height="6" rx="3" fill="#F5EFE4"/>
  <g class="ok"><circle cx="168" cy="196" r="12" fill="#F5EFE4"/><path d="M162 196l4 4 8-8" stroke="#C2571A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- trail + plane -->
  <path class="trail" d="M120 96C130 60 170 52 196 66" stroke="#D96A2B" stroke-width="2.5" stroke-linecap="round"/>
  <g class="plane">
    <path d="M200 40l58 16-50 30-6-18z" fill="#F5EFE4"/>
    <path d="M202 68l56-12-34 34z" fill="#E2D9CC"/>
    <path d="M202 68l6 18 6-12" fill="#C2571A"/>
  </g>
  <!-- sparkles -->
  <path class="sp" d="M232 128v14M225 135h14" stroke="#D96A2B" stroke-width="3" stroke-linecap="round"/>
  <path class="sp sp2" d="M40 54v10M35 59h10" stroke="#F5EFE4" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="sp sp3" cx="222" cy="200" r="4" fill="#F5EFE4"/>
  <circle class="sp sp2" cx="96" cy="66" r="3" fill="#D96A2B"/>
</svg>
