<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sp{stroke:#C2571A;stroke-width:4;stroke-linecap:round;animation:sp 1.2s linear infinite}
    .sp2{animation-delay:.4s}.sp3{animation-delay:.8s}
    @keyframes sp{0%{transform:translateX(30px);opacity:0}30%{opacity:1}100%{transform:translateX(-40px);opacity:0}}
    .bar{animation:load 2.4s cubic-bezier(.16,1,.3,1) infinite;transform-origin:96px 0}
    @keyframes load{0%{transform:scaleX(.05)}60%,100%{transform:scaleX(1)}}
    .bolt{animation:pulse 2.4s ease-in-out infinite;transform-origin:236px 92px}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08) rotate(-4deg)}}
  </style>
  <ellipse cx="160" cy="166" rx="120" ry="8" fill="#1E1B18" opacity=".08"/>
  <rect x="60" y="22" width="190" height="132" rx="12" fill="#F5EFE4" stroke="#1E1B18" stroke-width="3"/>
