  <circle cx="76" cy="34" r="4" fill="#C2571A"/><circle cx="90" cy="34" r="4" fill="#E2D9CC"/><circle cx="104" cy="34" r="4" fill="#E2D9CC"/>
  <rect x="120" y="29" width="110" height="10" rx="5" fill="#ECE3D2"/>
  <rect x="78" y="62" width="88" height="12" rx="4" fill="#1E1B18"/>
  <rect x="78" y="82" width="120" height="7" rx="3.5" fill="#E2D9CC"/>
  <rect x="78" y="95" width="100" height="7" rx="3.5" fill="#E2D9CC"/>
  <rect x="78" y="116" width="54" height="20" rx="10" fill="#C2571A"/>
  <rect x="96" y="144" width="120" height="5" rx="2.5" fill="#ECE3D2"/>
  <rect class="bar" x="96" y="144" width="120" height="5" rx="2.5" fill="#C2571A"/>
  <g class="bolt">
    <circle cx="236" cy="92" r="36" fill="#1E1B18"/>
    <path d="M242 66l-20 30h14l-6 24 22-32h-15z" fill="#D96A2B" stroke="#F5EFE4" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
