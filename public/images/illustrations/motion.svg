<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .c1{animation:f1 4s ease-in-out infinite}.c2{animation:f2 4s ease-in-out infinite}.c3{animation:f1 4s ease-in-out -2s infinite}
    @keyframes f1{50%{transform:translateY(-8px)}}@keyframes f2{50%{transform:translateY(7px) rotate(1deg)}}
    .orb{transform-origin:160px 92px;animation:spin 5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .tr{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-28}}
  </style>
  <ellipse cx="160" cy="166" rx="110" ry="8" fill="#1E1B18" opacity=".08"/>
  <ellipse class="tr" cx="160" cy="92" rx="128" ry="58" stroke="#C2571A" stroke-width="2.5" opacity=".6"/>
  <g class="c3"><rect x="58" y="44" width="92" height="72" rx="10" fill="#ECE3D2" stroke="#1E1B18" stroke-width="3" transform="rotate(-8 104 80)"/></g>
  <g class="c1"><rect x="120" y="30" width="100" height="112" rx="12" fill="#1E1B18"/>
    <circle cx="170" cy="72" r="20" fill="#D96A2B"/><path d="M164 64l14 8-14 8z" fill="#F5EFE4"/>
    <rect x="136" y="104" width="68" height="7" rx="3.5" fill="#6E655B"/><rect x="136" y="118" width="46" height="7" rx="3.5" fill="#6E655B"/></g>
  <g class="c2"><rect x="196" y="60" width="78" height="66" rx="10" fill="#F5EFE4" stroke="#1E1B18" stroke-width="3" transform="rotate(7 235 93)"/>
    <path d="M214 108c10-26 22-26 30-12s14 4 18-6" stroke="#C2571A" stroke-width="3.5" stroke-linecap="round" transform="rotate(7 235 93)"/></g>
  <g class="orb"><circle cx="288" cy="92" r="9" fill="#C2571A" stroke="#F5EFE4" stroke-width="3"/></g>
</svg>
