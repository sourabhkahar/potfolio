<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .wave{animation:wv 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .w2{animation-delay:.2s}.w3{animation-delay:.4s}.w4{animation-delay:.6s}.w5{animation-delay:.8s}
    @keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .day{animation:pick 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pick{0%,30%{transform:scale(0)}40%{transform:scale(1.2)}48%,100%{transform:scale(1)}}
    .card{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
    .ring{animation:rg 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes rg{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.6);opacity:0}}
  </style>
  <circle cx="140" cy="130" r="104" fill="#F5EFE4" opacity=".04"/>
  <!-- calendar -->
  <rect x="34" y="52" width="150" height="150" rx="18" fill="#1E1B18" stroke="#F5EFE4" stroke-opacity=".22" stroke-width="2"/>
  <path d="M34 70a18 18 0 0118-18h114a18 18 0 0118 18v14H34z" fill="#C2571A"/>
  <rect x="64" y="42" width="8" height="22" rx="4" fill="#F5EFE4"/><rect x="146" y="42" width="8" height="22" rx="4" fill="#F5EFE4"/>
  <g fill="#6E655B">
    <rect x="52" y="100" width="18" height="14" rx="4"/><rect x="78" y="100" width="18" height="14" rx="4"/><rect x="104" y="100" width="18" height="14" rx="4"/><rect x="130" y="100" width="18" height="14" rx="4"/><rect x="156" y="100" width="14" height="14" rx="4"/>
    <rect x="52" y="124" width="18" height="14" rx="4"/><rect x="78" y="124" width="18" height="14" rx="4"/><rect x="130" y="124" width="18" height="14" rx="4"/><rect x="156" y="124" width="14" height="14" rx="4"/>
    <rect x="52" y="148" width="18" height="14" rx="4"/><rect x="78" y="148" width="18" height="14" rx="4"/><rect x="104" y="148" width="18" height="14" rx="4"/><rect x="130" y="148" width="18" height="14" rx="4"/>
    <rect x="52" y="172" width="18" height="14" rx="4"/><rect x="78" y="172" width="18" height="14" rx="4"/>
  </g>
  <rect x="104" y="124" width="18" height="14" rx="4" fill="#3A342E"/>
  <g class="day"><circle cx="113" cy="131" r="13" fill="#F5EFE4"/><path d="M107 131l4 4 8-8" stroke="#C2571A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- call card -->
  <g class="card">
    <rect x="150" y="146" width="104" height="66" rx="16" fill="#F5EFE4"/>
    <circle class="ring" cx="176" cy="179" r="15" stroke="#C2571A" stroke-width="2"/>
    <circle cx="176" cy="179" r="15" fill="#C2571A"/>
    <path d="M170 173c0 8 5 13 12 13l2-4-4-2-2 2c-2-1-4-3-5-5l2-2-2-4z" fill="#F5EFE4"/>
    <g fill="#1E1B18">
      <rect class="wave"    x="200" y="166" width="5" height="26" rx="2.5"/>
      <rect class="wave w2" x="209" y="170" width="5" height="18" rx="2.5"/>
      <rect class="wave w3" x="218" y="163" width="5" height="32" rx="2.5"/>
      <rect class="wave w4" x="227" y="169" width="5" height="20" rx="2.5"/>
      <rect class="wave w5" x="236" y="172" width="5" height="14" rx="2.5"/>
    </g>
  </g>
  <path d="M220 70v12M214 76h12" stroke="#D96A2B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="236" cy="112" r="4" fill="#F5EFE4" opacity=".6"/>
</svg>
